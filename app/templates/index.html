<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SwimChi - Chicago Pool Schedules</title>
  <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
  <meta name="theme-color" content="#0057b7">
  <script>
    tailwind = { config: { theme: { extend: { colors: { brand: '#0057b7', 'brand-dark': '#004494' } } } } }
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-900 max-w-4xl mx-auto px-4 leading-normal">

  <header class="text-center py-6 pb-4">
    <h1 class="text-3xl font-bold text-brand">SwimChi</h1>
    <p class="text-gray-500 text-sm mt-1">Chicago Park District Pool Schedules</p>
  </header>

  <div id="filters" class="bg-white rounded-lg p-4 mb-6 shadow-sm flex flex-col sm:flex-row sm:flex-wrap gap-3 sm:items-center">
    <div class="flex items-center gap-2 w-full sm:w-auto">
      <label for="filter-type" class="text-sm font-semibold text-gray-600 whitespace-nowrap">Swim Type</label>
      <select id="filter-type" class="flex-1 min-w-0 text-sm border border-gray-300 rounded px-2 py-1.5 bg-white">
        <option value="">All Types</option>
      </select>
    </div>
    <div class="flex items-center gap-2 w-full sm:w-auto">
      <label for="filter-pool" class="text-sm font-semibold text-gray-600 whitespace-nowrap">Pool</label>
      <select id="filter-pool" class="flex-1 min-w-0 text-sm border border-gray-300 rounded px-2 py-1.5 bg-white">
        <option value="">All Pools</option>
      </select>
    </div>
    <div class="flex items-center gap-2 w-full sm:w-auto">
      <button id="btn-locate" type="button" class="px-3 py-1.5 text-sm bg-brand text-white border border-brand rounded cursor-pointer hover:bg-brand-dark transition-colors">Use My Location</button>
      <span id="location-status" class="text-xs text-gray-500"></span>
    </div>
    <div class="flex items-center gap-2 w-full sm:w-auto" id="distance-row" hidden>
      <label for="filter-distance" class="text-sm font-semibold text-gray-600 whitespace-nowrap">Max Distance</label>
      <select id="filter-distance" class="flex-1 min-w-0 text-sm border border-gray-300 rounded px-2 py-1.5 bg-white">
        <option value="">Any</option>
        <option value="1">1 mile</option>
        <option value="2">2 miles</option>
        <option value="3" selected>3 miles</option>
        <option value="5">5 miles</option>
        <option value="10">10 miles</option>
      </select>
    </div>
    <div class="flex items-center gap-2 w-full sm:w-auto">
      <label class="flex items-center gap-1.5 text-sm font-semibold text-gray-600 cursor-pointer select-none">
        <input type="checkbox" id="filter-favorites"> Favorites only
      </label>
    </div>
  </div>

  <div id="schedule"></div>

  <footer class="text-center py-8 text-gray-400 text-xs">
    <p>Data from <a href="https://www.chicagoparkdistrict.com" target="_blank" class="text-brand hover:underline">Chicago Park District</a>.</p>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
